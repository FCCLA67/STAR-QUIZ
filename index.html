      --red-deep:#C21E3A;
      --red-tint:#3A1B22;
      --line:#3A2C28;
      --green:#4FBE86;
      --green-tint:#1C2C22;
      --amber:#E0AA4E;
      --amber-tint:#33280F;
      --gray:#948A85;
      --shadow: 0 10px 30px rgba(0,0,0,0.45);
      --shadow-sm: 0 3px 10px rgba(0,0,0,0.35);

  }

    --bg:#18100E;
    --surface:#241A18;
    --surface-2:#2C201D;
    --text:#F3EAE4;
    --text-soft:#B8ACA6;

    --red-deep:#C21E3A;

    --line:#3A2C28;

  }
  .wrap{
    max-width:760px;
    margin:0 auto;
    padding:0 20px 64px;
  }
  .skip-focus:focus-visible, button:focus-visible, [tabindex]:focus-visible, input:focus-visible{
    outline:3px solid var(--red);

  }

  .hero-inner{
    max-width:760px;
    margin:0 auto;
  }
  .brandrow{

    gap:10px;
  }
  .star-mark{

  }
  .brand-name{

    font-size:1.35rem;
    letter-spacing:0.2px;
  }
  .tagline{
    margin-top:2px;
    font-size:0.92rem;
    color:rgba(255,255,255,0.86);
  }

    margin-top:26px;
  }
  .progress-track{
    height:7px;
    background:rgba(255,255,255,0.28);
    border-radius:20px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:#fff;
    border-radius:20px;
    transition:width 0.4s cubic-bezier(.4,0,.2,1);
  }
  .progress-label{
    margin-top:8px;
    font-size:0.85rem;
    color:rgba(255,255,255,0.85);
    display:flex;
    justify-content:space-between;
  }

    background:var(--surface);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow);
    padding:34px 30px;
    margin-top:-28px;
    position:relative;
  }

    .card{padding:26px 20px;}
  }

  .start-card h1{
    font-family:var(--font-display);
    font-size:1.7rem;
    line-height:1.25;
    margin:0 0 10px;
  }
  .start-card p{
    color:var(--text-soft);
    line-height:1.55;
    margin:0 0 18px;
    max-width:46ch;
  }
  .start-facts{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:26px;
  }
  .fact-chip{
    background:var(--surface-2);
    border-radius:999px;
    padding:7px 14px;
    font-size:0.85rem;
    color:var(--text);
  }

  .btn{
    font-family:var(--font-body);
    font-weight:600;
    font-size:0.98rem;
    border:none;
    border-radius:12px;
    padding:14px 26px;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;

  .btn:active{transform:translateY(1px);}
  .btn-primary{
    background:var(--red);
    color:#fff;
    box-shadow:0 6px 18px rgba(194,30,58,0.32);
  }
  .btn-primary:hover{box-shadow:0 8px 22px rgba(194,30,58,0.4);}
  .btn-primary:disabled{
    opacity:0.4;
    cursor:not-allowed;
    box-shadow:none;
  }
  .btn-ghost{
    background:transparent;
    color:var(--text);
    border:1.5px solid var(--line);
  }
  .btn-ghost:hover{border-color:var(--red); color:var(--red);}
  .btn-row{
    display:flex;
    gap:12px;
    margin-top:28px;
    flex-wrap:wrap;
  }

    font-weight:600;

    list-style:none;
    margin:0;

  .option{

  }
  .option input{

    width:0;height:0;
  }
  .option label{

    align-items:center;
    gap:12px;
    border:1.5px solid var(--line);

  .option label:hover{border-color:var(--red);}

  }
  .option input:checked + label .option-dot{border-color:var(--red);}
  .option input:checked + label .option-dot::after{
    content:"";
    position:absolute;
    inset:3px;
    border-radius:50%;
    background:var(--red);
  }

  .persona-tag{
    display:inline-block;
    background:rgba(255,255,255,0.18);
    border:1px solid rgba(255,255,255,0.4);

    font-size:0.82rem;

  .persona-desc{

    line-height:1.5;

    gap:14px;

  .event-rank{
    font-family:var(--font-display);
    font-size:0.85rem;
    color:var(--red);
    font-weight:600;
    margin:0 0 4px;

    font-family:var(--font-display);
    font-size:1.18rem;
    margin:0 0 6px;

    background:var(--green-tint);

    font-weight:700;
    font-size:0.95rem;
    border-radius:999px;

    font-size:0.8rem;
    color:var(--text);

  }

    font-weight:600;
    font-size:0.88rem;
    cursor:pointer;

    font-size:0.78rem;
    white-space:nowrap;

  .disclaimer{
    font-size:0.82rem;
    color:var(--text-soft);
    background:var(--surface-2);
    border-radius:var(--radius-sm);
    padding:12px 16px;
    margin-top:24px;
    line-height:1.5;
  }
  .footnote{
    text-align:center;
    font-size:0.8rem;
    color:var(--text-soft);
    margin-top:26px;
  }
</style>
</head>

];

/* ---------------------------------------------------------------
   State + rendering
--------------------------------------------------------------- */
let step = -1; // -1 = start screen, 0..14 = questions, 15 = results
let answers = new Array(questions.length).fill(null);
let expandedEvent = null;

const app = document.getElementById('app');

function starMark(){
  return `<svg class="star-mark" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path d="M20 3 L24.5 15.5 L38 16.5 L27.5 24.8 L31 38 L20 30.2 L9 38 L12.5 24.8 L2 16.5 L15.5 15.5 Z" fill="#fff" opacity="0.95"/>
  </svg>`;
}

function render(){
  if(step === -1) return renderStart();
  if(step >= 0 && step < questions.length) return renderQuestion();
  return renderResults();
}

function renderStart(){
  app.innerHTML = `
    <div class="hero">
      <div class="hero-inner">
        <div class="brandrow">${starMark()}<span class="brand-name">STAR PREP</span></div>
        <div class="tagline">Your guide to STAR Events.</div>
      </div>
    </div>
    <div class="wrap">
      <div class="card start-card">
        <h1>Let's find the STAR Event that's right for you.</h1>
        <p>Answer 15 quick questions about how you like to work, think, and compete. We'll match you with five STAR Events worth exploring — you're always free to research any event on your own too.</p>
        <div class="start-facts">
          <span class="fact-chip">15 questions</span>
          <span class="fact-chip">About 4 minutes</span>
          <span class="fact-chip">5 matches at the end</span>
        </div>
        <div class="btn-row">
          <button class="btn btn-primary" id="startBtn">Find My Event →</button>
        </div>
      </div>
      <p class="footnote">Your quiz matches are STAR PREP recommendations, not official FCCLA event assignments.</p>
    </div>
  `;
  document.getElementById('startBtn').addEventListener('click', ()=>{ step = 0; render(); });
}

function renderQuestion(){
  const total = questions.length;
  const current = questions[step];
  const pct = Math.round(((step) / total) * 100);
  app.innerHTML = `
    <div class="hero">
      <div class="hero-inner">
        <div class="brandrow">${starMark()}<span class="brand-name">STAR PREP</span></div>
        <div class="progress-shell">
          <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
          <div class="progress-label">
            <span>Question ${step+1} of ${total}</span>
            <span>${current.cat}</span>
          </div>
        </div>
      </div>
    </div>
    <div class="wrap">
      <div class="card">
        <p class="q-eyebrow">Discovery Quiz</p>
        <h2 class="q-text">${current.q}</h2>
        <ul class="option-list">
          ${current.options.map((opt,i)=>`
            <li class="option">
              <input type="radio" name="q${step}" id="q${step}o${i}" value="${i}" ${answers[step]===i?'checked':''}>
              <label for="q${step}o${i}"><span class="option-dot"></span><span>${opt.t}</span></label>
            </li>
          `).join('')}
        </ul>
        <div class="btn-row">
          ${step>0 ? `<button class="btn btn-ghost" id="backBtn">Back</button>` : ``}
          <button class="btn btn-primary" id="nextBtn" ${answers[step]===null?'disabled':''}>
            ${step===total-1 ? 'See My Matches →' : 'Next'}
          </button>
        </div>
      </div>
    </div>
  `;
  current.options.forEach((opt,i)=>{
    document.getElementById(`q${step}o${i}`).addEventListener('change', ()=>{
      answers[step] = i;
      document.getElementById('nextBtn').removeAttribute('disabled');
    });
  });
  if(step>0) document.getElementById('backBtn').addEventListener('click', ()=>{ step--; render(); });
  document.getElementById('nextBtn').addEventListener('click', ()=>{
    if(answers[step]===null) return;
    step++;
    render();
  });
}

function computePersonaScores(){
  const totals = {C:0,S:0,T:0,H:0,L:0,D:0,W:0};
  questions.forEach((q,i)=>{
    const chosen = answers[i];
    if(chosen===null) return;
    const w = q.options[chosen].w;
    Object.keys(w).forEach(k=> totals[k]+=w[k]);
  });
  return totals;
}

function topPersonaKey(totals){
  const order = ["C","S","T","H","L","D","W"];
  let best = order[0];
  order.forEach(k=>{ if(totals[k] > totals[best]) best = k; });
  return best;
}

function dot(vecA, vecB){
  let sum = 0;
  Object.keys(vecB).forEach(k=>{ sum += (vecA[k]||0) * vecB[k]; });
  return sum;
}

function computeMatches(totals){
  const scored = events.map(e => ({...e, score: dot(totals, e.vector)}));
  scored.sort((a,b)=> b.score - a.score);
  const top5 = scored.slice(0,5);
  const scores = top5.map(e=>e.score);
  const max = Math.max(...scores), min = Math.min(...scores);
  let pcts = top5.map(e=>{
    if(max===min) return 88;
    return 68 + Math.round(28 * (e.score - min) / (max - min));
  });
  for(let i=1;i<pcts.length;i++){
    if(pcts[i] >= pcts[i-1]) pcts[i] = pcts[i-1] - Math.max(1, Math.round(Math.random()*2)+1);
  }
  pcts = pcts.map(p=> Math.max(60, Math.min(96,p)));
  return top5.map((e,i)=> ({...e, pct: pcts[i]}));
}

function whyLine(event, topKey){
  if(event.lines[topKey]) return {text:event.lines[topKey], persona:personaMeta[topKey].name};
  // fall back to the persona this event weights most heavily
  const keys = Object.keys(event.vector).sort((a,b)=> event.vector[b]-event.vector[a]);
  const fallbackKey = keys[0];
  if(event.lines[fallbackKey]) return {text:event.lines[fallbackKey], persona:personaMeta[fallbackKey].name};
  return {text:"You scored well across several of the traits this event tends to reward.", persona:personaMeta[topKey].name};
}

function renderResults(){
  const totals = computePersonaScores();
  const topKey = topPersonaKey(totals);
  const persona = personaMeta[topKey];
  const matches = computeMatches(totals);

  app.innerHTML = `
    <div class="hero">
      <div class="hero-inner">
        <div class="brandrow">${starMark()}<span class="brand-name">STAR PREP</span></div>
        <div style="margin-top:22px;">
          <span class="persona-tag">Your STAR PREP type</span>
          <h1 class="persona-name">${persona.name}</h1>
          <p class="persona-desc">${persona.desc}</p>
        </div>
      </div>
    </div>
    <div class="wrap">
      <div class="card">
        <p class="section-label">We found your STAR Event matches!</p>
        <p class="section-sub">Ranked by how well they fit your answers. 💡 Match percentages are STAR PREP recommendations, not official FCCLA scores — you're free to explore or choose any eligible event.</p>
        <div id="eventList"></div>
        <div class="btn-row">
          <button class="btn btn-ghost" id="retakeBtn">Retake Quiz</button>
        </div>
        <div class="disclaimer">
          Requirements marked 🔴 come from official FCCLA STAR Event materials. Everything marked 💡 is STAR PREP coaching — helpful context, not an official rule. For anything you need to verify, ask your Co-President or check the current FCCLA materials.
        </div>
      </div>
    </div>
  `;

  const list = document.getElementById('eventList');
  list.innerHTML = matches.map((e,i)=>{
    const why = whyLine(e, topKey);
    const isOpen = expandedEvent === e.name;
    return `
      <div class="event-card">
        <div class="event-top">
          <div>
            <p class="event-rank">${['1st','2nd','3rd','4th','5th'][i]} match</p>
            <h3 class="event-name">${e.name}</h3>
          </div>
          <span class="match-pct">${e.pct}%</span>
        </div>
        <div class="badge-row">
          ${e.badges.map(b=>`<span class="badge">${b}</span>`).join('')}
          <span class="badge">${e.team}</span>
          <span class="badge">${e.levels}</span>
        </div>
        <p class="why-line"><span class="tip-tag">💡 Why it matches:</span> ${why.text}</p>
        <button class="detail-toggle" data-event="${e.name}">${isOpen ? 'Hide official details −' : 'View official details +'}</button>
        ${isOpen ? `
          <div class="event-detail">
            ${e.official.map(o=>`<div class="official-line"><span class="official-tag">🔴 OFFICIAL</span><span>${o}</span></div>`).join('')}
          </div>
        ` : ``}
      </div>
    `;
  }).join('');

  list.querySelectorAll('.detail-toggle').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const name = btn.getAttribute('data-event');
      expandedEvent = expandedEvent === name ? null : name;
      renderResults();
    });
  });

  document.getElementById('retakeBtn').addEventListener('click', ()=>{
    step = -1;
    answers = new Array(questions.length).fill(null);
    expandedEvent = null;
    render();
  });
}

render();
</script>
